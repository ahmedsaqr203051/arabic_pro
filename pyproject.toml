[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic_pro"
version = "0.0.1"
description = "Comprehensive Arabic translation and UI fixes for ERPNext 16."
authors = [
    { name = "Antigravity", email = "info@example.com" }
]
dependencies = []

[tool.setuptools.packages.find]
include = ["arabic_pro*"]

[tool.bench]
app_name = "arabic_pro"
app_title = "Arabic Pro"
app_publisher = "Antigravity"
app_description = "Comprehensive Arabic translation and UI fixes for ERPNext 16."
app_license = "mit"
