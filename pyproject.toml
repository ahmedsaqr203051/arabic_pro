[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "arabic_pro"
authors = [
    {name = "Antigravity", email = "info@example.com"},
]
description = "Comprehensive Arabic translation and UI fixes for ERPNext 16."
requires-python = ">=3.10"
dynamic = ["version"]

[tool.flit.module]
name = "arabic_pro"

[tool.bench]
app_name = "arabic_pro"
app_title = "Arabic Pro"
app_publisher = "Antigravity"
app_description = "Comprehensive Arabic translation and UI fixes for ERPNext 16."
app_email = "info@example.com"
app_license = "mit"
